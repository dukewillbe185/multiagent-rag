<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1250" viewBox="0 0 2400 1250">
  <defs>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #172033; }
      .title { font-size: 54px; font-weight: 700; }
      .subtitle { font-size: 25px; fill: #65708a; }
      .node { stroke-width: 2.5; rx: 18; }
      .input { fill: #eaf3ff; stroke: #4d8fd8; }
      .process { fill: #eef7f2; stroke: #53a574; }
      .azure { fill: #f3eeff; stroke: #8b6bd6; }
      .output { fill: #fff4e8; stroke: #e99a45; }
      .error { fill: #fff0f0; stroke: #d56363; }
      .node-title { font-size: 27px; font-weight: 700; text-anchor: middle; }
      .node-sub { font-size: 21px; fill: #556078; text-anchor: middle; }
      .edge { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow2); }
      .edge-label { font-size: 20px; fill: #556078; text-anchor: middle; }
      .lane { fill: #f8fafc; stroke: #d7dee8; stroke-width: 2; rx: 24; }
      .lane-title { font-size: 25px; font-weight: 700; fill: #3f4b61; }
    </style>
  </defs>
  <rect width="2400" height="1250" fill="#ffffff"/>
  <text class="title" x="100" y="85">文档上传与索引：完整 I/O</text>
  <text class="subtitle" x="100" y="130">同一条管道同时服务于 API 上传和 CLI process 命令</text>

  <rect class="lane" x="70" y="180" width="2260" height="690"/>
  <text class="lane-title" x="110" y="225">成功路径</text>
  <rect class="lane" x="70" y="910" width="2260" height="240"/>
  <text class="lane-title" x="110" y="955">异常与清理路径</text>

  <!-- Connectors -->
  <path class="edge" d="M360 350 H450"/>
  <path class="edge" d="M760 350 H850"/>
  <path class="edge" d="M1170 350 H1260"/>
  <path class="edge" d="M1580 350 H1670"/>
  <path class="edge" d="M1990 350 H2080"/>
  <path class="edge" d="M2205 430 V610 H1930"/>
  <path class="edge" d="M1750 690 H1590"/>
  <path class="edge" d="M1270 690 H1110"/>
  <path class="edge" d="M790 690 H630"/>
  <path class="edge" d="M310 690 H210"/>

  <path class="edge" d="M605 430 V1000 H850"/>
  <path class="edge" d="M1010 430 V1000 H850"/>
  <path class="edge" d="M1420 430 V1000 H850"/>
  <path class="edge" d="M1830 430 V1000 H850"/>
  <path class="edge" d="M605 430 V1080 H1670"/>

  <!-- Top row -->
  <rect class="node input" x="100" y="280" width="260" height="150"/>
  <text class="node-title" x="230" y="327">输入</text>
  <text class="node-sub" x="230" y="365">API: multipart PDF</text>
  <text class="node-sub" x="230" y="397">CLI: 本地 PDF 路径</text>

  <rect class="node process" x="450" y="280" width="310" height="150"/>
  <text class="node-title" x="605" y="327">验证与临时文件</text>
  <text class="node-sub" x="605" y="365">后缀 / 文件存在性</text>
  <text class="node-sub" x="605" y="397">API 写入临时 PDF</text>

  <rect class="node process" x="850" y="280" width="320" height="150"/>
  <text class="node-title" x="1010" y="327">DocumentExtractor</text>
  <text class="node-sub" x="1010" y="365">读取 PDF 二进制</text>
  <text class="node-sub" x="1010" y="397">调用 prebuilt-layout</text>

  <rect class="node azure" x="1260" y="280" width="320" height="150"/>
  <text class="node-title" x="1420" y="327">Document Intelligence</text>
  <text class="node-sub" x="1420" y="365">OCR + Layout 分析</text>
  <text class="node-sub" x="1420" y="397">异步分析结果</text>

  <rect class="node process" x="1670" y="280" width="320" height="150"/>
  <text class="node-title" x="1830" y="327">TextChunker</text>
  <text class="node-sub" x="1830" y="365">默认 1200 字符</text>
  <text class="node-sub" x="1830" y="397">默认 20% 重叠</text>

  <rect class="node process" x="2080" y="280" width="250" height="150"/>
  <text class="node-title" x="2205" y="327">Chunks</text>
  <text class="node-sub" x="2205" y="365">content / chunk_id</text>
  <text class="node-sub" x="2205" y="397">metadata</text>

  <!-- Bottom row -->
  <rect class="node process" x="1750" y="610" width="360" height="160"/>
  <text class="node-title" x="1930" y="657">Embedder</text>
  <text class="node-sub" x="1930" y="695">每批最多 16 个 chunk</text>
  <text class="node-sub" x="1930" y="727">返回 1536 维向量</text>

  <rect class="node azure" x="1270" y="610" width="320" height="160"/>
  <text class="node-title" x="1430" y="657">Embedding API</text>
  <text class="node-sub" x="1430" y="695">文本列表 → 向量列表</text>
  <text class="node-sub" x="1430" y="727">Azure AI Foundry</text>

  <rect class="node process" x="790" y="610" width="320" height="160"/>
  <text class="node-title" x="950" y="657">AzureSearchIndexer</text>
  <text class="node-sub" x="950" y="695">检查/创建索引</text>
  <text class="node-sub" x="950" y="727">每批最多上传 100 条</text>

  <rect class="node azure" x="310" y="610" width="320" height="160"/>
  <text class="node-title" x="470" y="657">Azure AI Search</text>
  <text class="node-sub" x="470" y="695">HNSW Vector + BM25</text>
  <text class="node-sub" x="470" y="727">持久化 chunk 文档</text>

  <rect class="node output" x="90" y="610" width="220" height="160"/>
  <text class="node-title" x="200" y="650">输出</text>
  <text class="node-sub" x="200" y="687">API: UploadResponse</text>
  <text class="node-sub" x="200" y="719">CLI: 统计日志</text>
  <text class="node-sub" x="200" y="751">indexed / failed</text>

  <!-- Error lane -->
  <rect class="node error" x="850" y="970" width="420" height="130"/>
  <text class="node-title" x="1060" y="1015">失败输出</text>
  <text class="node-sub" x="1060" y="1053">格式错误 → HTTP 400</text>
  <text class="node-sub" x="1060" y="1083">运行异常 → HTTP 500 / CLI exit 1</text>

  <rect class="node output" x="1670" y="970" width="430" height="130"/>
  <text class="node-title" x="1885" y="1015">finally 清理</text>
  <text class="node-sub" x="1885" y="1053">API 删除临时 PDF</text>
  <text class="node-sub" x="1885" y="1083">清理失败只记录 warning</text>
</svg>
