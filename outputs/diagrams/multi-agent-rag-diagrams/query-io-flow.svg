<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1750" viewBox="0 0 2400 1750">
  <defs>
    <marker id="arrow3" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #172033; }
      .title { font-size: 54px; font-weight: 700; }
      .subtitle { font-size: 25px; fill: #65708a; }
      .node { stroke-width: 2.5; rx: 18; }
      .input { fill: #eaf3ff; stroke: #4d8fd8; }
      .process { fill: #eef7f2; stroke: #53a574; }
      .agent { fill: #f3eeff; stroke: #8b6bd6; }
      .guard { fill: #fff4e8; stroke: #e99a45; }
      .output { fill: #edf7ff; stroke: #5b9fc8; }
      .reject { fill: #fff0f0; stroke: #d56363; }
      .node-title { font-size: 26px; font-weight: 700; text-anchor: middle; }
      .node-sub { font-size: 20px; fill: #556078; text-anchor: middle; }
      .edge { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow3); }
      .edge-dashed { fill: none; stroke: #8792a5; stroke-width: 2.5; stroke-dasharray: 11 9; marker-end: url(#arrow3); }
      .edge-label { font-size: 20px; fill: #556078; text-anchor: middle; }
      .lane { fill: #f8fafc; stroke: #d7dee8; stroke-width: 2; rx: 24; }
      .lane-title { font-size: 25px; font-weight: 700; fill: #3f4b61; }
    </style>
  </defs>
  <rect width="2400" height="1750" fill="#ffffff"/>
  <text class="title" x="100" y="85">查询与回答：完整 I/O</text>
  <text class="subtitle" x="100" y="130">API 外层安全与会话包装 + LangGraph 四智能体工作流</text>

  <rect class="lane" x="70" y="180" width="2260" height="330"/>
  <text class="lane-title" x="110" y="225">API 包装层</text>
  <rect class="lane" x="70" y="550" width="2260" height="750"/>
  <text class="lane-title" x="110" y="595">LangGraph 多智能体层</text>
  <rect class="lane" x="70" y="1340" width="2260" height="300"/>
  <text class="lane-title" x="110" y="1385">输出组装与横切能力</text>

  <!-- Connectors first -->
  <path class="edge" d="M390 340 H480"/>
  <path class="edge" d="M810 340 H900"/>
  <path class="edge" d="M1230 340 H1320"/>
  <path class="edge" d="M1650 340 H1740"/>
  <path class="edge" d="M2070 340 H2170"/>
  <path class="edge" d="M1905 420 V500 H250 V1430"/>
  <path class="edge" d="M1905 420 V650 H430"/>

  <path class="edge" d="M730 715 H840"/>
  <path class="edge" d="M1140 715 H1250"/>
  <path class="edge" d="M1550 715 H1660"/>
  <path class="edge" d="M1960 715 H2070"/>
  <path class="edge" d="M2200 795 V930 H1960"/>
  <path class="edge" d="M1660 1010 H1550"/>
  <path class="edge" d="M1250 1010 H1140"/>
  <path class="edge" d="M840 1010 H730"/>
  <path class="edge" d="M430 1090 V1190 H1200"/>

  <path class="edge" d="M1005 795 V1260 H1970 V1430"/>
  <path class="edge" d="M1415 795 V1260 H1970 V1430"/>
  <path class="edge" d="M1200 1270 V1430"/>
  <path class="edge" d="M1450 1510 H1540"/>
  <path class="edge" d="M1870 1510 H1960"/>
  <path class="edge-dashed" d="M750 1510 H520 V1090"/>

  <!-- API layer nodes -->
  <rect class="node input" x="100" y="270" width="290" height="150"/>
  <text class="node-title" x="245" y="315">QueryRequest</text>
  <text class="node-sub" x="245" y="350">question / session_id</text>
  <text class="node-sub" x="245" y="380">top_k / user_id / metadata</text>

  <rect class="node process" x="480" y="270" width="330" height="150"/>
  <text class="node-title" x="645" y="315">Pydantic + request_id</text>
  <text class="node-sub" x="645" y="350">字段校验</text>
  <text class="node-sub" x="645" y="380">生成请求追踪 ID</text>

  <rect class="node process" x="900" y="270" width="330" height="150"/>
  <text class="node-title" x="1065" y="315">读取 Session</text>
  <text class="node-sub" x="1065" y="350">上一轮 question / answer</text>
  <text class="node-sub" x="1065" y="380">计算 conversation_turn</text>

  <rect class="node guard" x="1320" y="270" width="330" height="150"/>
  <text class="node-title" x="1485" y="315">输入 Content Safety</text>
  <text class="node-sub" x="1485" y="350">四类内容审核</text>
  <text class="node-sub" x="1485" y="380">Prompt Shield</text>

  <rect class="node process" x="1740" y="270" width="330" height="150"/>
  <text class="node-title" x="1905" y="315">构造 RagState</text>
  <text class="node-sub" x="1905" y="350">问题 + 上一轮记忆</text>
  <text class="node-sub" x="1905" y="380">空检索与 Agent 输出字段</text>

  <rect class="node reject" x="2130" y="270" width="200" height="150"/>
  <text class="node-title" x="2230" y="315">提前返回</text>
  <text class="node-sub" x="2230" y="350">输入被拦截</text>
  <text class="node-sub" x="2230" y="380">success=false</text>

  <!-- Agent layer first row -->
  <rect class="node agent" x="130" y="650" width="300" height="145"/>
  <text class="node-title" x="280" y="695">Guardrail Agent</text>
  <text class="node-sub" x="280" y="733">LLM 判断 relevant</text>
  <text class="node-sub" x="280" y="765">irrelevant / unsafe</text>

  <rect class="node agent" x="430" y="650" width="300" height="145"/>
  <text class="node-title" x="580" y="695">Retrieval Agent</text>
  <text class="node-sub" x="580" y="733">组织混合检索</text>
  <text class="node-sub" x="580" y="765">保存 chunks + metadata</text>

  <rect class="node process" x="840" y="650" width="300" height="145"/>
  <text class="node-title" x="990" y="695">查询向量化</text>
  <text class="node-sub" x="990" y="733">question → vector[1536]</text>
  <text class="node-sub" x="990" y="765">Embedding API</text>

  <rect class="node process" x="1250" y="650" width="300" height="145"/>
  <text class="node-title" x="1400" y="695">混合搜索</text>
  <text class="node-sub" x="1400" y="733">Vector + BM25</text>
  <text class="node-sub" x="1400" y="765">Azure AI Search</text>

  <rect class="node agent" x="1660" y="650" width="300" height="145"/>
  <text class="node-title" x="1810" y="695">Intent Agent</text>
  <text class="node-sub" x="1810" y="733">七类意图分类</text>
  <text class="node-sub" x="1810" y="765">异常时 general</text>

  <rect class="node agent" x="2070" y="650" width="260" height="145"/>
  <text class="node-title" x="2200" y="695">Answer Agent</text>
  <text class="node-sub" x="2200" y="733">来源 + 记忆</text>
  <text class="node-sub" x="2200" y="765">生成回答</text>

  <!-- Agent layer second row -->
  <rect class="node process" x="1660" y="930" width="300" height="160"/>
  <text class="node-title" x="1810" y="975">答案与检索元数据</text>
  <text class="node-sub" x="1810" y="1013">answer / intent</text>
  <text class="node-sub" x="1810" y="1045">source / score / content</text>

  <rect class="node guard" x="1250" y="930" width="300" height="160"/>
  <text class="node-title" x="1400" y="975">输出 Content Safety</text>
  <text class="node-sub" x="1400" y="1013">审核生成答案</text>
  <text class="node-sub" x="1400" y="1045">命中时替换答案</text>

  <rect class="node process" x="840" y="930" width="300" height="160"/>
  <text class="node-title" x="990" y="975">更新 Session</text>
  <text class="node-sub" x="990" y="1013">保存当前 Q/A</text>
  <text class="node-sub" x="990" y="1045">供下一轮使用</text>

  <rect class="node output" x="280" y="930" width="450" height="160"/>
  <text class="node-title" x="505" y="975">QueryResponse</text>
  <text class="node-sub" x="505" y="1013">answer / intent / turn / sources</text>
  <text class="node-sub" x="505" y="1045">chunks / guardrails / processing time</text>

  <rect class="node reject" x="930" y="1190" width="540" height="110"/>
  <text class="node-title" x="1200" y="1232">图内 Guardrail 拒绝分支</text>
  <text class="node-sub" x="1200" y="1268">直接结束 LangGraph；不检索、不更新会话</text>

  <!-- Output/cross-cutting -->
  <rect class="node process" x="750" y="1430" width="330" height="160"/>
  <text class="node-title" x="915" y="1475">Session Memory</text>
  <text class="node-sub" x="915" y="1513">仅保留上一轮 Q/A</text>
  <text class="node-sub" x="915" y="1545">默认 30 分钟过期</text>

  <rect class="node process" x="1120" y="1430" width="330" height="160"/>
  <text class="node-title" x="1285" y="1475">响应组装</text>
  <text class="node-sub" x="1285" y="1513">ChunkInfo / sources</text>
  <text class="node-sub" x="1285" y="1545">平均分与耗时</text>

  <rect class="node process" x="1540" y="1430" width="330" height="160"/>
  <text class="node-title" x="1705" y="1475">Monitoring</text>
  <text class="node-sub" x="1705" y="1513">Agent Trace / Event</text>
  <text class="node-sub" x="1705" y="1545">Metric / Console Log</text>

  <rect class="node output" x="1960" y="1430" width="330" height="160"/>
  <text class="node-title" x="2125" y="1475">最终输出</text>
  <text class="node-sub" x="2125" y="1513">HTTP 200 + QueryResponse</text>
  <text class="node-sub" x="2125" y="1545">异常时 HTTP 422 / 500</text>

  <text class="node-sub" x="1200" y="1690">CLI query 仅调用 LangGraph：不经过 API 外层 Content Safety，也不使用 Session Memory</text>
</svg>
